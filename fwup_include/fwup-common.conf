#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "tachyon")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Harald Ringvold")

# LUN 0 of the UFS enumerates as /dev/sda on the Tachyon (verify with lsblk;
# the other LUNs enumerate as /dev/sdb../dev/sdg).
define(NERVES_FW_DEVPATH, "/dev/sda")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/sda6") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Layout of UFS LUN 0 ("HLOS LUN", /dev/sda)
#
# IMPORTANT: fwup does NOT write the partition table on this platform. The
# Tachyon's UFS uses 4096-byte logical sectors and its GPT is provisioned
# once with sgdisk/EDL (see the top-level README). fwup only ever writes raw
# data and FAT files at the byte offsets defined below, which is sector-size
# agnostic since fwup block units are 512 bytes of plain byte offset.
#
# +-------------------------------+
# | GPT (4096-byte LBAs)          |
# +-------------------------------+
# | p1: BOOT (FAT32, 512 MiB)     |  stock "efi" ESP, kept in place;
# |     Image.a, Image.b,         |  holds the Nerves kernels + DTBs
# |     tachyon-a.dtb, ...        |
# +-------------------------------+
# | p2: persist (30 MiB)          |  stock partition, NEVER written
# +-------------------------------+
# | p3: uboot_env (1 MiB)         |  raw U-Boot environment at its start
# +-------------------------------+
# | p4: rootfs A (squashfs)       |
# +-------------------------------+
# | p5: rootfs B (squashfs)       |
# +-------------------------------+
# | p6: data (f2fs, grows)        |
# +-------------------------------+
#
# All other LUNs (XBL, firmware, modem NV, ...) are Qualcomm/Particle-owned
# and are never touched by fwup.
#
# VERIFY AGAINST HARDWARE (Phase 0): the p1/p2 offsets below assume the stock
# ptool layout starts the "efi" partition at 4K-LBA 6 (byte offset 24576).
# Confirm with `sgdisk -p /dev/sda` on stock Ubuntu before first flash.
#
# Offsets/counts are in 512-byte blocks as required by fwup.

# Stock "efi" ESP: 4K-LBA 6, 512 MiB. Reused as the Nerves BOOT partition.
define(BOOT_PART_OFFSET, 48)
define(BOOT_PART_COUNT, 1048576)

# Stock "persist": 30 MiB. Reserved, never written. Listed for documentation.
define(PERSIST_PART_OFFSET, 1048624)
define(PERSIST_PART_COUNT, 61440)

# uboot_env partition: placed at 544 MiB (byte 0x22000000) so the raw
# environment sits at a clean absolute offset for U-Boot
# (CONFIG_ENV_SCSI_HW_PARTITION="0:3"), fwup, and /etc/fw_env.config.
# The environment itself is 128 KiB at the start of the 1 MiB partition.
define(UBOOT_ENV_OFFSET, 1114112)
define(UBOOT_ENV_COUNT, 256)  # 128 KB

# A/B rootfs partitions, 512 MiB each, starting at 545 MiB
define(ROOTFS_A_PART_OFFSET, 1116160)
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application data partition, from 1569 MiB. The GPT partition is sized at
# provisioning time to fill the rest of LUN 0; APP_PART_COUNT below is only
# used by factory-reset trimming and must not exceed the provisioned size.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 16777216) # 8 GiB

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

# Location where installed firmware information is stored.
# This is the real U-Boot environment (shared with the bootloader).
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}
