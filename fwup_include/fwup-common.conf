#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "tachyon")
define(NERVES_FW_ARCHITECTURE, "aarch64")
define(NERVES_FW_AUTHOR, "Harald Ringvold")

# LUN 0 of the UFS enumerates as /dev/sda on the Tachyon (verified on
# hardware 2026-08-30; the other LUNs enumerate as /dev/sdb../dev/sdg).
define(NERVES_FW_DEVPATH, "/dev/sda")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/sda15") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# Layout of UFS LUN 0 ("HLOS LUN", /dev/sda)
#
# VERIFIED ON HARDWARE (2026-08-30, 24.04.4 beta, recon dump
# tachyon-recon-20260830-220055): the deployed 24.04 image keeps the gen-1
# Android-style GPT. Stock LUN 0 is (4096-byte LBAs):
#
#   p1  frp          LBA 6        512 KiB   ┐
#   p2  art          LBA 134      512 KiB   │
#   p3  keystore     LBA 262      512 KiB   │
#   p4  ssd          LBA 390      8 KiB     │ stock partitions,
#   p5  misc         LBA 392      1 MiB     │ kept in place,
#   p6  cache        LBA 648      256 MiB   │ NEVER written by fwup
#   p7  systemrw     LBA 66184    8 MiB     │
#   p8  recovery     LBA 68232    64 MiB    │
#   p9  recoveryfs   LBA 84616    256 MiB   │
#   p10 userdata     LBA 150152   4 GiB     ┘
#   p11..p15: carved by Nerves out of the old system_a partition
#             (LBA 1198728..30599162, ~112 GiB) — see below and README.md
#
# Nerves partitions (all 1 MiB-aligned, provisioned once with sgdisk):
#
#   p11 uboot_env    LBA 1198848  1 MiB     raw U-Boot env (128 KiB) at start
#   p12 BOOT         LBA 1199104  128 MiB   FAT: Image.a/b, tachyon-a/b.dtb
#   p13 rootfs_a     LBA 1231872  512 MiB   squashfs
#   p14 rootfs_b     LBA 1362944  512 MiB   squashfs
#   p15 data         LBA 1494016  ~111 GiB  f2fs application data
#
# The stock ESP (`boot_b` on /dev/sdg25, GRUB) and every other LUN (XBL,
# modem NV, firmware, ...) are Qualcomm/Particle-owned and never touched.
# U-Boot itself lives inside the XBL partitions (patched+test-signed via
# Particle's tachyon-u-boot install.sh flow) — not on LUN 0 at all.
#
# IMPORTANT: fwup does NOT write the partition table on this platform. The
# UFS uses 4096-byte logical sectors and its GPT is provisioned once with
# sgdisk (see the top-level README). fwup only ever writes raw data and FAT
# files at the offsets defined below. fwup offsets are in 512-byte blocks
# (plain byte offset / 512), which is sector-size agnostic.

# uboot_env partition (p11): raw environment of 128 KiB at the partition
# start (byte 0x1_24AF_0000). Keep in sync with
# rootfs_overlay/etc/fw_env.config and uboot/nerves.fragment
# (CONFIG_ENV_SCSI_HW_PARTITION="0:b" — U-Boot part numbers are hex —
# CONFIG_ENV_SIZE=0x20000).
define(UBOOT_ENV_OFFSET, 9590784)
define(UBOOT_ENV_COUNT, 256)  # 128 KB

# BOOT partition (p12): FAT, holds the kernels + DTBs for both slots.
define(BOOT_PART_OFFSET, 9592832)
define(BOOT_PART_COUNT, 262144) # 128 MiB

# A/B rootfs partitions (p13/p14), 512 MiB each
define(ROOTFS_A_PART_OFFSET, 9854976)
define(ROOTFS_A_PART_COUNT, 1048576)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application data partition (p15). The GPT partition is sized at
# provisioning time to fill the rest of the old system_a space;
# APP_PART_COUNT below is only used by factory-reset trimming and must not
# exceed the provisioned size.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 16777216) # 8 GiB

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}

# Location where installed firmware information is stored.
# This is the real U-Boot environment (shared with the bootloader).
uboot-environment uboot-env {
    block-offset = ${UBOOT_ENV_OFFSET}
    block-count = ${UBOOT_ENV_COUNT}
}
